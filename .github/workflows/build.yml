name: 构建多平台

# 触发方式：
#   1) 网页上 Actions -> 构建多平台 -> Run workflow（手动）
#   2) git push 一个 v 开头的 tag（同时会发 Release）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write            # 发布 Release 需要

jobs:
  # ------------------------------------------------------------------ #
  # 主矩阵：4 个平台组合，每个组合一个独立 runner
  # ------------------------------------------------------------------ #
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # 一个平台挂了不取消其它平台
      max-parallel: 4
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            artifact: wave-windows-x64
          - label: macos-arm64
            os: macos-14
            artifact: wave-macos-arm64
          - label: macos-x86_64
            os: macos-13
            artifact: wave-macos-x86_64
          - label: linux-x64
            os: ubuntu-22.04
            artifact: wave-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pydub pyinstaller

      - name: 安装 Qt 运行库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libegl1

      - name: 打包
        run: pyinstaller --noconfirm build.spec

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 可选：在 ubuntu:20.04 容器里再编一份 Linux 包（兼容老发行版 glibc）
  # 不需要兼容 Ubuntu 20.04 / Debian 11 的话，整个 job 可以删掉
  # ------------------------------------------------------------------ #
  build-linux-legacy:
    name: linux-x64-legacy
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖与 Python 包
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-dev libgl1 libxkbcommon-x11-0 libegl1
          python3 -m pip install --upgrade pip
          python3 -m pip install pyqt5 pydub pyinstaller

      - name: 打包
        run: python3 -m PyInstaller --noconfirm build.spec

      - uses: actions/upload-artifact@v4
        with:
          name: wave-linux-x64-legacy
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 打 tag 时，把所有产物合成一个 Release
  # ------------------------------------------------------------------ #
  release:
    needs: [build, build-linux-legacy]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 每个平台压成一个 zip
        run: |
          cd dist
          for d in */; do
            (cd "$d" && zip -qr "../${d%/}.zip" .)
          done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
