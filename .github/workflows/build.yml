name: 构建多平台

# 触发方式：
#   1) 网页上 Actions -> 构建多平台 -> Run workflow（手动）
#   2) push 一个 v 开头的 tag（如 v1.1.0），会顺便发布 Release
#
# 注意 tag 必须以 v 开头：旧的 2026.10.29 是手动发布会，这个 workflow 不认纯数字 tag。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write            # 发布 Release 需要

env:
  PYTHON_VERSION: "3.12"
  # Windows runner 的控制台默认是 cp1252，脚本里任何非 ASCII 输出都会 UnicodeEncodeError，
  # 所以强制 Python 用 UTF-8 模式（stdio 也走 UTF-8）。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ------------------------------------------------------------------ #
  # 主矩阵：4 个平台组合，每个组合一个独立 runner
  # ------------------------------------------------------------------ #
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # 一个平台挂了不取消其它平台
      max-parallel: 4
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            artifact: wave-windows-x64
          - label: macos-arm64
            os: macos-15
            artifact: wave-macos-arm64
          - label: macos-x86_64
            os: macos-15-intel     # macos-13（Intel）已被 GitHub 下线，改用 15-intel
            artifact: wave-macos-x86_64
          - label: linux-x64
            os: ubuntu-22.04
            artifact: wave-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 安装 Qt 运行库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libegl1

      - name: 打包（发布版，无控制台）
        env:
          WP_EXE_NAME: wave_painter
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: 打包（调试版，仅 Windows）
        if: runner.os == 'Windows'
        env:
          WP_CONSOLE: "1"
          WP_EXE_NAME: wave_painter
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: 压缩产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path (Join-Path dist '*') -DestinationPath '${{ matrix.artifact }}.zip' -Force
          Move-Item '${{ matrix.artifact }}.zip' dist/

      - name: 压缩产物（macOS，保留 .app 内的符号链接）
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qry "../${{ matrix.artifact }}.zip" .
          cd ..
          mv "${{ matrix.artifact }}.zip" dist/

      - name: 压缩产物（Linux）
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -qry "../${{ matrix.artifact }}.zip" .
          cd ..
          mv "${{ matrix.artifact }}.zip" dist/

      # 必须放在压缩之后：macOS 的 dist 里只有一个 .app 目录，
      # 压缩前算校验和会因为“没有文件”直接失败。
      - name: 生成 SHA256SUMS.txt
        run: python scripts/sha256sums.py dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # wave_painter.exe 单独作为 Release 附件发布，不强制用户下载整个 zip
      - name: 上传独立 exe（仅 Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wave-windows-exe
          path: dist/wave_painter.exe
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 打 tag 时，把所有平台的 zip 合成一个 Release
  # ------------------------------------------------------------------ #
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和（zip + 独立 exe）
        run: |
          cd dist
          ls -lh
          sha256sum *.zip > SHA256SUMS.txt
          if [ -f wave_painter.exe ]; then sha256sum wave_painter.exe >> SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/wave_painter.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
